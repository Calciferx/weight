spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://192.168.111.131:1433;databaseName=weight20
    username: xxxx
    password: xxxxxxxxx
weight:
  slave-ip: 10.206.4.243
  coil-num: 6
  enable-auth: true
  enable-auto-scan: true
  enable-modbus-device-init: true
  enable-serial-device-init: true
  enable-voice: true
  # 称重时的采样次数
  sampled-time: 10
  min-weight: 1000
  max-weight: 100000
  # 等待时间，单位毫秒，超过该时间没有状态变化将重置系统
  wait-time: 60000
  modbus-device-info-path: classpath:config/modbus_device_info.json
  serial-device-info-path: classpath:config/serial_device_info.json
  # 一般工业固体废物出长环节记录表
  # 运输单位
  waste-trans-unit: 甘肃宏盛信息科技有限公司
  # 接收单位
  waste-receive-unit: 白银市宏盛环保有限公司
  # 甘肃华鹭铝业有限公司汽车衡检斤原始记录
  # 流向
  raw-trans-orientation: 甘肃宏盛信息科技有限公司
  active-scale: ToledoT800
  scales:
    ToledoT800:
      frame-length: 18
      terminator: "0D0A"
      weight-start: 16
      weight-end: 28
      status-start: 0
      status-end: 4
      stable-value: "5354"
    KeliD2008:
      frame-length: 12
      terminator: "03"
      weight-start: 4
      weight-end: 16
      status-start: 16
      status-end: 18
      stable-value: "30"

logging:
  config: file:config/logback-spring.xml