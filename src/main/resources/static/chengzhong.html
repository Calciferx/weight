<script>
    // 一进页面自动勾选上自动过磅
    $('#type7').prop('checked', true)
    $('.box .form-control').prop('disabled', true)
    $('.handBox .btn,.btn_cancel,.btn_insert1,.btn_dataCof').prop('disabled', true)

    /* WebSocket 初始化与消息处理 */
    let ws_url = location.origin.replace('http', 'ws') + '/weightproject/websocket/socketServer.do?' + loginId
    WsManager.init(ws_url, ws_onmessage);

    function ws_onmessage(data) {
        switch (data.type) {
            case WS_TYPE.SYSTEM_SUCCESS:
                console.log('WS 连接成功');
                break;
            case WS_TYPE.INFR_NORTH_OUT: // 北车检红外
            case WS_TYPE.INFR_NORTH_IN:  // 北计量红外
            case WS_TYPE.INFR_SOUTH_IN:  // 南计量红外
            case WS_TYPE.INFR_SOUTH_OUT: // 南车检红外
                const infrMap = {
                    [WS_TYPE.INFR_NORTH_OUT]: '.beforeInfr1',
                    [WS_TYPE.INFR_NORTH_IN]: '.beforeInfr2',
                    [WS_TYPE.INFR_SOUTH_IN]: '.afterInfr1',
                    [WS_TYPE.INFR_SOUTH_OUT]: '.afterInfr2'
                };
                $(`.WeighingStatus ${infrMap[data.type]}`).css('background-color', data.data ? '#00B83F' : '#A60000');
                break;
            case WS_TYPE.WEIGH_LOG: // 称重日志
                $('.messageBox').append(`<div class="infoContent"><span>${data.data}</span></div>`);
                getScrool();
                break;
            case WS_TYPE.TRUCK_INFO: // 车辆信息
                const fieldMap = {
                    plateNumber: 'plateNumber',
                    roughWeight: 'roughWeight',
                    supplierName: 'supplierName',
                    tareWeight: 'tareWeight',
                    materialName: 'materialName',
                    netWeight: 'netWeight',
                    comment: 'comment'
                };
                for (let key in fieldMap) {
                    if (data.data[key]) $('.container [name="' + fieldMap[key] + '"]').val(data.data[key]);
                }
                break;
            case WS_TYPE.RT_WEIGH_NUM: // 实时称重KG
                start(data.data.weightNum);
                const isStable = (data.data.status === SCALE_STATUS.STABLE);
                const isUnstable = (data.data.status === SCALE_STATUS.UNSTABLE);
                $('.container .transBox span').css('background', isUnstable ? 'linear-gradient(white, green)' : 'linear-gradient(white, red)');
                $('.container .stableBox span').css('background', isStable ? 'linear-gradient(white, green)' : 'linear-gradient(white, red)');
                if (!$('#type7').prop('checked')) {
                    $('.btn_cancel,.btn_insert1,.btn_dataCof').prop('disabled', !(isStable && data.data.weightNum !== ''));
                }
                break;
            case WS_TYPE.WEIGH_INFO: // 称重结果
                $('.container [name="roughWeight"]').val(data.data.roughWeight);
                $('.container [name="tareWeight"]').val(data.data.tareWeight);
                $('.container [name="netWeight"]').val(data.data.netWeight);
                getTables();
                break;
            case WS_TYPE.TRUCK_AND_WEIGHT: // 重置
                clearDashboard();
                getTables();
                break;
            case WS_TYPE.READ_MATERIAL:
                $('.container [name="materialName"]').val(data.data);
                break;
            case WS_TYPE.READ_SUPPLIER:
                $('.container [name="supplierName"]').val(data.data);
                break;
        }
    }

    function clearDashboard() {
        $('.container .form-control').val('');
    }

    function getScrool() {
        let top = $(".messageBox")[0].scrollHeight;
        $(".messageBox").scrollTop(top);
    }
</script>
<script>
    //数字滚动
    var chartNum = ['0', '0', '0', '0', '0', '0'];
    start('000000');

    function start(num) {
        let strHtml = "";
        for (let i = 0; i < 6; i++) {
            strHtml += `<li class="number-item"><span><i class="item">0123456789</i></span></li>`;
        }
        $("#TNum").html(strHtml);
        toOrderNum(num);
        setNumberTransform();
    }

    function toOrderNum(num) {
        num = num.toString().padStart(6, '0');
        if (num.length > 6) {
            console.error('重量数值超出显示范围');
            num = '999999';
        }
        chartNum = num.split('');
    }

    function setNumberTransform() {
        const numberItems = $('.item');
        chartNum.forEach((num, i) => {
            if (numberItems[i]) {
                numberItems[i].style.transform = `translate(-50%, -${num * 10}%)`;
            }
        });
    }

    // 称重记录查询
    let dataType = {token};
    $('#bodyInsert select').change(() => {
        dataType.recordType = $('#bodyInsert [data-id="recordType"]').val();
        dataType.completeStatus = $('#bodyInsert [data-id="logType"]').val();
        getTables();
    });
    dataType.startTime = moment().format('YYYY-MM-DD 00:00:00');
    getTables();

    function getTables() {
        dataType.endTime = moment().format('YYYY-MM-DD HH:mm:ss');
        $.post('admin/weightRecord/query', dataType, res => {
            if (res.code != 1111) return layer.msg(res.msg);
            const $tbody = $('#tableInsert tbody').empty();
            res.data.forEach((item, i) => {
                const $row = $(addRow());
                const fields = ['id', 'weighId', 'supplierName', 'materialName', 'plateNumber', 'roughWeight', 'tareWeight', 'netWeight', 'weighDate', 'weighStatus', 'isPrint', 'controlId', 'comment', 'weighMan', 'auditor', 'isTest', 'carType'];
                fields.forEach((field, index) => {
                    $row.find(`[data-id="jl${index + 1}"]`).val(item[field] || '');
                });
                $tbody.append($row);
            });
            totalAmount();
        });
    }

    function addRow() {
        let inputs = "";
        for (let i = 1; i <= 17; i++) {
            inputs += `<td><input class="form-control disabled" disabled data-id="jl${i}"/></td>`;
        }
        return `<tr>${inputs}</tr>`;
    }

    function totalAmount() {
        let rough = 0, tare = 0, net = 0;
        $('#tableInsert tbody tr').each(function () {
            rough = zMath.plus(rough, $(this).find('[data-id="jl6"]').val() || 0);
            tare = zMath.plus(tare, $(this).find('[data-id="jl7"]').val() || 0);
            net = zMath.plus(net, $(this).find('[data-id="jl8"]').val() || 0);
        });
        $('#tableInsert tfoot .roughWeight').text(rough.toFixed(toDecimal));
        $('#tableInsert tfoot .tareWeight').text(tare.toFixed(toDecimal));
        $('#tableInsert tfoot .netWeight').text(net.toFixed(toDecimal));
    }

    $('.btn_reset').click(() => {
        $.post('admin/initSystem', {token}, res => layer.msg(res.msg));
    });

    $('#type7').click(function () {
        const checked = $(this).prop('checked');
        $('.box .form-control, .handBox .btn, .btn_cancel, .btn_insert1').prop('disabled', checked);
    });

    $('.btn_cancel').click(clearDashboard);

    $('.btn_beforePole, .btn_afterPole').click(function () {
        $.post('/device/modbus/name', {token, deviceName: $(this).attr('data-type')}, res => layer.msg(res.msg));
    });
</script>
