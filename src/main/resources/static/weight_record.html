<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title></title>
    <!--第三方css-->
    <link rel="stylesheet" href="_plugin/layui/css/layui.css">
    <link rel="stylesheet" href="_plugin/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="_plugin/zTree/css/bootstrapStyle/bootstrapStyle.css">

    <!--自定义css-->
    <link rel="stylesheet" href="_css/main.css">

</head>
<body>
<!--主框架-->
<div class="bodyGrid">
    <header>
        <div class="btnBar">
            <div class="btn-group">
                <button class="btn btn-info btn_insert">新增</button>
                <button class="btn btn-info btn_update">修改</button>
                <button class="btn btn-info btn_delete">删除</button>
            </div>
            <div class="btn-group searchBox">
                <input class="form-control" data-id="startTime" id="startTime" placeholder="请选择开始时间" readonly>
            </div>
            <div class="btn-group">至</div>
            <div class="btn-group searchBox">
                <input class="form-control" data-id="endTime" id="endTime" placeholder="请选择结束时间" readonly>
            </div>
            <div class="btn-group">
                <button class="btn btn-outline-info btn_select1">查询</button>
            </div>
        </div>
        <div class="btnBar">
            <select class="form-control custom-select" id="printFormat" lay-ignore
                    style="width: 320px; display: inline-block; vertical-align: middle; margin-right: 10px; height: 38px;">
                <option value="waste">一般工业固体废弃物出厂环节记录表</option>
                <option value="raw">检斤原始记录表</option>
            </select>
            <div class="btn-group">
                <button class="btn btn-info" id="btn_preview_report">预览报表</button>
                <button class="btn btn-info btn_print" do-ignore>打印磅单</button>
            </div>
        </div>
    </header>
    <main>
        <table class="layui-table" id="dataTable" lay-filter="dataTable"></table>
    </main>
</div>

<!--副框架-->
<form class="layui-form bodyGrid" id="formInsert" lay-filter="formInsert">
    <header>
        <div class="btnBar">
            <div class="btn-group btn-group-sm">
                <button class="btn_submit" lay-submit lay-filter="btn_submit">保存</button>
            </div>
            <!--            <div class="btn-group btn-group-sm">-->
            <!--                <button class="btn_submit_new" lay-submit lay-filter="btn_submit_new">保存新增</button>-->
            <!--            </div>-->
            <div class="btn-group btn-group-sm">
                <button class="btn_return">返回</button>
            </div>
        </div>
    </header>
    <main>
        <div class="form-row">
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">序号</label>
                    <div class="col-8">
                        <input class="form-control" name="id">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">检斤编号</label>
                    <div class="col-8">
                        <input class="form-control" name="weighId" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">供应商名称</label>
                    <div class="col-8">
                        <!--                        <input class="form-control" name="supplierName" lay-verify="required">-->
                        <select class="form-control" name="supplierName" lay-verify="required">

                        </select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">物料名称</label>
                    <div class="col-8">
                        <!--                        <input class="form-control" name="materialName" lay-verify="required">-->
                        <select class="form-control" name="materialName" lay-verify="required"></select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">车牌号</label>
                    <div class="col-8">
                        <!--                        <input class="form-control" name="plateNumber" lay-verify="required">-->
                        <select class="form-control" name="plateNumber" lay-verify="required"></select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">毛重(KG)</label>
                    <div class="col-8">
                        <input class="form-control" name="roughWeight" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">皮重(KG)</label>
                    <div class="col-8">
                        <input class="form-control" name="tareWeight" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">净重(KG)</label>
                    <div class="col-8">
                        <input class="form-control" name="netWeight" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">检斤员</label>
                    <div class="col-8">
                        <!--                        <input class="form-control" name="weighMan" lay-verify="required">-->
                        <select class="form-control" name="weighMan" lay-verify="required"></select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">检斤状态</label>
                    <div class="col-8">
                        <input class="form-control" name="weighStatus" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">检斤日期</label>
                    <div class="col-8">
                        <input class="form-control" name="weighDate" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">毛重时间</label>
                    <div class="col-8">
                        <input class="form-control" name="roughWeightTime" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">皮重时间</label>
                    <div class="col-8">
                        <input class="form-control" name="tareWeightTime" lay-verify="required">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">受控编号</label>
                    <div class="col-8">
                        <!--                        <input class="form-control" name="controlId" lay-verify="required">-->
                        <select class="form-control" name="controlId" lay-verify="required">
                            <option value="Q/CHALCO-GS-910351-JL057-2019 ">Q/CHALCO-GS-910351-JL057-2019</option>
                            <option value="Q/CHALCO-GS-910351-JL017-2019 ">Q/CHALCO-GS-910351-JL017-2019</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">是否化验</label>
                    <div class="col-8">
                        <!--                        <input class="form-control" name="isTest" lay-verify="required">-->
                        <select class="form-control" name="isTest" lay-verify="required">
                            <option value="是         ">是</option>
                            <option value="否         ">否</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group form-row">
                    <label class="col-4 col-form-label">备注</label>
                    <div class="col-8">
                        <input class="form-control" name="comment">
                    </div>
                </div>
            </div>
        </div>
    </main>
</form>


<!--第三方js-->
<script src="_plugin/layui/layui.all.js"></script>
<script src="_plugin/layui/lay/modules/laydate.js"></script>
<script src="_plugin/jquery/jquery-3.3.1.min.js"></script>
<script src="_plugin/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="_plugin/zTree/js/jquery.ztree.core.min.js"></script>
<script src="_plugin/zj/zMath.js"></script>
<script src="_plugin/moment/moment.min.js"></script>
<!--自定义js-->
<script src="_js/main.js"></script>
<script>
    const queryUrl = 'admin/weightRecord/query';
    const deleteUrl = 'admin/weightRecord/delete';
    const saveOrUpdateUrl = 'admin/weightRecord/saveOrUpdate';

    // 时间插件初始化
    const commonDateCfg = {max: 0, type: 'datetime', trigger: 'click'};
    laydate.render({...commonDateCfg, elem: '#startTime', value: moment().format('YYYY-MM-DD 00:00:00')});
    laydate.render({...commonDateCfg, elem: '#endTime', value: new Date()});
    laydate.render({...commonDateCfg, elem: '.form-control[name="weighDate"]'});

    datasl.startTime = $('#startTime').val();
    datasl.endTime = $('#endTime').val();

    $('.btn_select1').click(() => {
        datasl.startTime = $('#startTime').val();
        datasl.endTime = $('#endTime').val();
        getTable();
    });

    function getTable() {
        datasl.token = token;
        laytable.render({
            elem: '#dataTable',
            url: queryUrl,
            where: datasl,
            method: 'post',
            headers: {token},
            height: 'full-100',
            cols: [[
                {width: 45, type: 'radio'},
                {minWidth: 80, title: '序号', templet: `<div><a href="##" class="btn_xiangqing">{{d.id}}</a></div>`},
                {minWidth: 120, title: '检斤编号', field: 'weighId'},
                {minWidth: 150, title: '供应商名称', field: 'supplierName'},
                {minWidth: 120, title: '物料名称', field: 'materialName'},
                {minWidth: 120, title: '车牌号', field: 'plateNumber'},
                {minWidth: 120, title: '毛重(KG)', field: 'roughWeight'},
                {minWidth: 120, title: '皮重(KG)', field: 'tareWeight'},
                {minWidth: 120, title: '净重(KG)', field: 'netWeight'},
                {minWidth: 120, title: '检斤员', field: 'weighMan'},
                {minWidth: 120, title: '检斤状态', field: 'weighStatus'},
                {minWidth: 120, title: '检斤日期', field: 'weighDate'},
                {minWidth: 120, title: '毛重时间', field: 'roughWeightTime'},
                {minWidth: 120, title: '皮重时间', field: 'tareWeightTime'},
                {minWidth: 120, title: '受控编号', field: 'controlId'},
                {minWidth: 120, title: '是否化验', field: 'isTest'},
                {minWidth: 120, title: '备注', field: 'comment'},
            ]],
            page: {layout: ['prev', 'page', 'next', 'skip', 'count', 'limit'], limits: [10, 20, 50, 100], limit: 20},
            request: {pageName: 'page', limitName: 'pageSize'},
            response: {statusCode: 1111},
            parseData: res => ({code: res.code, msg: res.msg, count: res.total, data: res.data}),
            done: res => done_table(res)
        });
    }

    function getDetail() {
        layform.val('formInsert', thistr);
        thisform = layform.val('formInsert');
        $('.form-control[name="id"]').prop('disabled', true);
    }

    function getItemList() {
        loadSelectList("admin/supplierInfo/queryAll", 'select[name="supplierName"]', "supplierName", "supplierName");
        loadSelectList("admin/material/queryAll", 'select[name="materialName"]', "materialName", "materialName");
        loadSelectList("admin/car/queryAll", 'select[name="plateNumber"]', "plateNumber", "plateNumber");
        loadSelectList("admin/user/queryAll", 'select[name="weighMan"]', "realName", "realName");
    }

    $('.btn_insert').click(() => {
        getItemList();
        $('.form-control[name="id"]').prop('disabled', true);
    });

    $('.btn_update').click(function () {
        getItemList();
        const checkeds = laytable.checkStatus('dataTable').data;
        if (!checkeds.length) return layer.msg('请选择一条数据');
        if (checkeds.length > 1) return layer.msg('每次只能修改一条数据');
        thistr = checkeds[0];
        to_update();
    });

    $('.btn_delete').click(() => {
        const checkeds = laytable.checkStatus('dataTable').data;
        if (!checkeds.length) return layer.msg('请至少选择一条数据');
        const ids = checkeds.map(item => item.id).join(',');
        layer.confirm(`确定删除选中的 ${checkeds.length} 条记录吗？`, index => {
            ajaxPost(deleteUrl, {token, id: ids}, res => done(res), '删除失败');
        });
    });

    $('#btn_preview_report').click(() => {
        const format = $('#printFormat').val();
        const params = $.param({
            startTime: $('#startTime').val(),
            endTime: $('#endTime').val(),
            templateKey: format,
            token
        });
        window.open(`admin/weightRecord/previewReport?${params}`, '_blank');
    });

    $('.btn_print').click(() => {
        const checkeds = laytable.checkStatus('dataTable').data;
        if (!checkeds.length) return layer.msg('请选择一条数据');
        layer.confirm(`确定打印磅单吗？`, index => {
            $.post('admin/weightRecord/print', {id: checkeds[0].id, token}, res => {
                layer.msg(res.msg);
                layer.close(index);
            });
        });
    });

    function doSubmit(field, btn) {
        field.token = token;
        ajaxPost(saveOrUpdateUrl, field, res => done_submit(res, btn), '保存失败');
    }
</script>
</body>
</html>
